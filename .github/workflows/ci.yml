name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The language model (1.1 GB) is not needed for unit tests or lint; tools/fetch_model.ps1 gets it for builds.
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  tools:
    name: Model specs and wearable protocol self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pytest
      - name: Feature specifications and shipped model checksums
        run: python -m pytest -q ml/tests
      - name: Wearable sync protocol self-test
        run: python tools/wearable-emulator/emulate.py --selftest
