<title id="title">G-one model footprint</title>
<desc id="desc">Actual APK is 1182249970 bytes, with 94.51 percent occupied by the uncompressed GGUF. Theoretical nominal 1.5 billion parameter weight sizes are shown separately from measured GGUF size.</desc>
